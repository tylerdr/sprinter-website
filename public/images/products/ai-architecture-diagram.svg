<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="12" fill="#0f0f0f" stroke="#27272a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f4f4f5">AI System Architecture</text>
  
  <!-- Data Layer -->
  <rect x="30" y="50" width="80" height="40" rx="8" fill="#1a1a1a" stroke="#27272a"/>
  <text x="45" y="70" font-family="Arial, sans-serif" font-size="10" fill="#71717a">Data Sources</text>
  <text x="45" y="82" font-family="Arial, sans-serif" font-size="10" fill="#71717a">& Documents</text>
  
  <!-- Processing Layer -->
  <rect x="160" y="50" width="80" height="40" rx="8" fill="#3b82f6/20" stroke="#3b82f6"/>
  <text x="175" y="70" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">AI Processing</text>
  <text x="175" y="82" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">& Analysis</text>
  
  <!-- Output Layer -->
  <rect x="290" y="50" width="80" height="40" rx="8" fill="#10b981/20" stroke="#10b981"/>
  <text x="305" y="70" font-family="Arial, sans-serif" font-size="10" fill="#10b981">Intelligent</text>
  <text x="305" y="82" font-family="Arial, sans-serif" font-size="10" fill="#10b981">Responses</text>
  
  <!-- Arrows -->
  <path d="M120 70 L150 70 M145 65 L150 70 L145 75" stroke="#6b7280" stroke-width="2" fill="none"/>
  <path d="M250 70 L280 70 M275 65 L280 70 L275 75" stroke="#6b7280" stroke-width="2" fill="none"/>
  
  <!-- Components Detail -->
  <g transform="translate(0, 120)">
    <!-- Vector DB -->
    <rect x="30" y="20" width="60" height="30" rx="6" fill="#1a1a1a" stroke="#27272a"/>
    <text x="45" y="38" font-family="Arial, sans-serif" font-size="9" fill="#71717a">Vector DB</text>
    
    <!-- LLM -->
    <rect x="110" y="20" width="60" height="30" rx="6" fill="#1a1a1a" stroke="#27272a"/>
    <text x="130" y="38" font-family="Arial, sans-serif" font-size="9" fill="#71717a">LLM</text>
    
    <!-- RAG -->
    <rect x="190" y="20" width="60" height="30" rx="6" fill="#1a1a1a" stroke="#27272a"/>
    <text x="210" y="38" font-family="Arial, sans-serif" font-size="9" fill="#71717a">RAG</text>
    
    <!-- API -->
    <rect x="270" y="20" width="60" height="30" rx="6" fill="#1a1a1a" stroke="#27272a"/>
    <text x="290" y="38" font-family="Arial, sans-serif" font-size="9" fill="#71717a">API</text>
    
    <!-- Connecting lines -->
    <path d="M90 35 L105 35" stroke="#3b82f6/50" stroke-width="1" fill="none"/>
    <path d="M170 35 L185 35" stroke="#3b82f6/50" stroke-width="1" fill="none"/>
    <path d="M250 35 L265 35" stroke="#3b82f6/50" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Benefits -->
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#f4f4f5">Key Benefits:</text>
  <text x="30" y="220" font-family="Arial, sans-serif" font-size="10" fill="#10b981">• 90% faster information retrieval</text>
  <text x="30" y="235" font-family="Arial, sans-serif" font-size="10" fill="#10b981">• Evidence-backed responses</text>
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="10" fill="#10b981">• Scalable to millions of documents</text>
  
  <!-- Human in loop indicator -->
  <rect x="220" y="200" width="150" height="60" rx="8" fill="#f59e0b/10" stroke="#f59e0b/40"/>
  <text x="230" y="218" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Human-in-the-Loop</text>
  <text x="230" y="235" font-family="Arial, sans-serif" font-size="9" fill="#71717a">• Review & approval workflow</text>
  <text x="230" y="248" font-family="Arial, sans-serif" font-size="9" fill="#71717a">• Quality assurance checks</text>
</svg>